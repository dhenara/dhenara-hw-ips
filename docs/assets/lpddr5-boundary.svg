<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="238" viewBox="0 0 1120 238" role="img" aria-labelledby="title desc">
<title id="title">LPDDR5 controller integration boundary</title><desc id="desc">AXI4 and APB4 connect to host and control logic, then channel scheduling and integrity logic. DFI connects to an external PHY and LPDDR5 memory. Physical integration is outside initial qualification.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4c7581"/></marker></defs>
<rect width="1120" height="238" rx="14" fill="#f5f8fa"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="28" y="34" font-size="14" font-weight="600" fill="#354e60">CONTROLLER AT A GLANCE</text>
<rect x="206" y="55" width="607" height="134" rx="12" fill="#e6f5f0" stroke="#80bdae"/>
<text x="225" y="79" font-size="12" fill="#336c60">REPOSITORY RTL</text>
<g fill="#fff" stroke="#bbcbd6"><rect x="28" y="95" width="135" height="68" rx="8"/><rect x="225" y="95" width="235" height="68" rx="8"/><rect x="512" y="95" width="281" height="68" rx="8"/><rect x="878" y="95" width="214" height="68" rx="8"/></g>
<g fill="#233e51" font-size="16" font-weight="600" text-anchor="middle"><text x="95" y="123">AXI4 / APB4</text><text x="342" y="123">Host + control</text><text x="652" y="123">Channel + integrity</text><text x="985" y="123">External PHY</text></g>
<g fill="#5d7180" font-size="12" text-anchor="middle"><text x="95" y="145">Traffic and registers</text><text x="342" y="145">Ordering · credits · configuration</text><text x="652" y="145">Scheduling · ECC · lifecycle</text><text x="985" y="145">LPDDR5 memory interface</text></g>
<g stroke="#4c7581" stroke-width="2" marker-end="url(#arrow)"><path d="M164 129h49"/><path d="M461 129h39"/><path d="M794 129h72"/></g>
<text x="836" y="116" text-anchor="middle" font-size="12" fill="#4c7581">DFI</text>
<text x="28" y="217" font-size="12" fill="#607785">Conceptual boundary. Physical PHY integration, timing and silicon validation remain outside this first release.</text>
</g></svg>
