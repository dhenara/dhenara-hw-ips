name: LPDDR5 controller checks
on:
  workflow_dispatch:
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Set tool storage
        run: echo "DHENARA_AGENT_TOOL_STORAGE_ROOT=$RUNNER_TEMP/lpddr5-tools" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - run: make -f ips/lpddr5_mc/Makefile prepare
      - run: make -f ips/lpddr5_mc/Makefile check-controller EVIDENCE="$GITHUB_WORKSPACE/ips/lpddr5_mc/evidence/ci" BUILD_SUBDIR=ci CHECK_ARGS=--require-clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lpddr5-controller-evidence
          path: |
            ips/lpddr5_mc/evidence/ci/
            ips/lpddr5_mc/dv/host/out/ci/
